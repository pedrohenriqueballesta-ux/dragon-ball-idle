<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragon Ball Idle — Animações</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171911;color:#f0d7aa;font:14px system-ui}header{padding:12px 20px;border-bottom:1px solid #82603b;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0}a{color:#ecc98b}button,select{font:inherit;color:inherit;background:#33291c;border:1px solid #997348;border-radius:4px;padding:6px 12px}button:focus-visible,select:focus-visible{outline:2px solid #8bdaef}output{font-variant-numeric:tabular-nums;min-width:110px}canvas{display:block;width:1280px;height:785px;image-rendering:pixelated}.scroll{overflow:auto}p{margin:0;padding:10px 20px;color:#c7bb9e;font-size:12px}
</style>
<header><h1>Animações · 16 quadros · 8 direções</h1><a href="/">Voltar ao jogo</a>
<label>Ação <select id="action"><option value="walk">Caminhar</option><option value="attack">Atacar</option><option value="idle">Parado</option></select></label>
<button id="previous">Anterior</button><button id="next">Próximo</button><button id="play">Reproduzir</button><output id="counter">Quadro 1 / 16</output></header>
<p>As diagonais usam vistas em três quartos. A prévia não altera seu personagem nem seu progresso.</p>
<div class="scroll"><canvas id="preview" width="1280" height="785" aria-label="Prévia de Goku, Super Saiyajin, Saibaman, Sentinela e Guardião em oito direções"></canvas></div>
<script type="module">
import { art, drawGoku, drawSaibaman, drawAlien } from './art/index.mjs';
import { DIRECTIONS } from './render/camera.mjs';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const action=document.querySelector('#action'),counter=document.querySelector('#counter'),play=document.querySelector('#play');
let frame=0,playing=false,last=0,elapsed=0;
const update=()=>counter.textContent=`Quadro ${frame+1} / 16`;
document.querySelector('#previous').onclick=()=>{playing=false;play.textContent='Reproduzir';frame=(frame+15)%16;update()};
document.querySelector('#next').onclick=()=>{playing=false;play.textContent='Reproduzir';frame=(frame+1)%16;update()};
play.onclick=()=>{playing=!playing;play.textContent=playing?'Pausar':'Reproduzir';elapsed=0};
action.onchange=()=>{frame=0;update()};
const rows=['Goku','Super Saiyajin','Saibaman','Sentinela','Guardião da Cratera'];
function paint(now){
 const dt=(now-last)/1000;last=now;
 if(playing){elapsed+=Math.min(dt,.1);while(elapsed>=.075){frame=(frame+1)%16;elapsed-=.075}update()}
 ctx.fillStyle='#25351e';ctx.fillRect(0,0,1280,785);
 ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillStyle='#ead1a4';
 DIRECTIONS.forEach((d,col)=>ctx.fillText(d.label,165+col*145,25));
 rows.forEach((name,row)=>{
  const y=147+row*148;
  ctx.fillStyle=row%2?'#ffffff05':'#00000009';ctx.fillRect(0,y-110,1280,148);
  ctx.fillStyle='#ead1a4';ctx.font='12px system-ui';ctx.textAlign='left';ctx.fillText(name,10,y-38);
  DIRECTIONS.forEach((facing,col)=>{
   const x=165+col*145;ctx.strokeStyle='#f0d7aa25';ctx.beginPath();ctx.moveTo(x-40,y+8);ctx.lineTo(x+40,y+8);ctx.stroke();
   ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(x,y+4,20,6,0,0,Math.PI*2);ctx.fill();
   const moving=action.value==='walk',progress=action.value==='attack'?frame/16:null;
   const height=row===4?91:row<2?76:65,stride=row===4?136:row<2?96:80;
   if(row<2)drawGoku(ctx,{facing,moving,transformed:row===1},{x,y,travelled:frame*stride/16},now/1000,progress);
   else (row===2?drawSaibaman:drawAlien)(ctx,x,y,50,height,now/1000,moving,facing,0,progress,frame*stride/16);
  });
 });
 requestAnimationFrame(paint);
}
// .flat(): art.freezaFrames é uma lista de 16 imagens, não uma imagem só.
const images=Object.values(art).flat();
Promise.all(images.map(im=>im.decode().catch(()=>{}))).then(()=>requestAnimationFrame(paint));
</script>
</html>
